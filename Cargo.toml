[workspace]
members = ["apps/desktop/src-tauri", "packages/rust-security-core", "apps/contributor-node"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.12.7" }
tauri-build = { version = "=2.7.6" }
url = { version = "=2.5.9" }
